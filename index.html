<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%AD%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a12" />
    <title>鼠标的偶像梦模拟器</title>
    <meta name="description" content="一个文字演出类的虚拟偶像养成推演游戏：靠25万启动资金，把8个不火的VUP送上线上演唱会的舞台。" />
  </head>
  <body>
    <script>
      // 首屏防闪烁：在 Vue 挂载前先把主题定下来
      ;(function () {
        try {
          var m = localStorage.getItem('mouse-idol-theme-v1') || 'system'
          var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
